# Quarkus HTTP & CORS Configuration
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS
quarkus.analytics.disabled=true

# Database Configuration (Local MySQL)
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=bmsroot
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/crm_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Hibernate ORM Configuration
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=import.sql

# OpenAPI & Swagger UI Configuration
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.info-title=Dev CRM API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=RESTful APIs for Dev CRM with MySQL database persistence

